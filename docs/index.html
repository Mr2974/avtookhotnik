<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ликвидные машины ниже рынка на Sauto.cz и Bazoš.cz">
<title>Автоохотник CZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a working feed. Run summary on top, filter bar, then one card per car,
   price set against its market median like a price tag on a lot. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #eef1f6;
  --fg: #141821;
  --muted: #5a6273;
  --line: #dde2ea;
  --accent: #2443c4;
  --accent-soft: #e5eaff;
  --good: #137a43;
  --good-soft: #def4e7;
  --warn: #9a6200;
  --warn-soft: #fbefd6;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --plate: #ffffff;
  --plate-ink: #111111;
  --plate-eu: #1d3fae;
  --shadow: 0 1px 2px rgba(20, 24, 33, .06), 0 4px 16px rgba(20, 24, 33, .05);
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --surface: #161a22; --surface-2: #1d222c; --fg: #e7eaf0; --muted: #98a1b3;
    --line: #2a303c; --accent: #8ea4ff; --accent-soft: #232c4d; --good: #5fd391; --good-soft: #17301f;
    --warn: #f2b65a; --warn-soft: #33270f; --bad: #ff8a80; --bad-soft: #3a1b19;
    --plate: #e9ebef; --plate-ink: #111111; --plate-eu: #2747b8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --surface: #161a22; --surface-2: #1d222c; --fg: #e7eaf0; --muted: #98a1b3;
  --line: #2a303c; --accent: #8ea4ff; --accent-soft: #232c4d; --good: #5fd391; --good-soft: #17301f;
  --warn: #f2b65a; --warn-soft: #33270f; --bad: #ff8a80; --bad-soft: #3a1b19;
  --plate: #e9ebef; --plate-ink: #111111; --plate-eu: #2747b8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { margin: 0; }
.tg { display: inline-flex; margin-top: 10px; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 4vw, 30px); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 4px 0 0; max-width: 68ch; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }

.run { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.run div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.run .k { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.run .v { font-family: var(--f-data); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.run .v.accent { color: var(--accent); }

.bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; }
.tab { border: 0; background: transparent; color: var(--muted); font: 500 14px var(--f-body); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.tab .c { font-family: var(--f-data); font-size: 12px; margin-left: 4px; color: var(--muted); }
select, .chk { font: 14px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.chk input { accent-color: var(--accent); margin: 0; }
button:focus-visible, select:focus-visible, a:focus-visible, .chk:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.list { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px 20px; }
.card.is-new { border-color: var(--accent); }
.head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.plate { display: inline-flex; align-items: stretch; border: 1.5px solid var(--plate-ink); border-radius: 4px; overflow: hidden; background: var(--plate); color: var(--plate-ink); font: 600 13px var(--f-data); line-height: 1; }
.plate .eu { background: var(--plate-eu); color: #fff; font-size: 9px; padding: 4px 4px 2px; display: grid; place-items: end center; }
.plate .t { padding: 4px 7px; letter-spacing: .06em; display: grid; place-items: center; }
.title { font-weight: 600; font-size: 16px; margin: 6px 0 2px; overflow-wrap: anywhere; }
.title a { color: inherit; text-decoration: none; }
.title a:hover { text-decoration: underline; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 13.5px; }
.facts b { color: var(--fg); font-weight: 600; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); max-width: 100%; overflow-wrap: anywhere; }
.chip.hot { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.src { background: transparent; border: 1px solid var(--line); }
.vin { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 10px; font-size: 13px; }
.vin-k { font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.vin code { font: 600 13px var(--f-data); letter-spacing: .04em; background: var(--surface-2); padding: 3px 7px; border-radius: 6px; overflow-wrap: anywhere; }
.vin-none { color: var(--muted); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.desc { margin-top: 8px; color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.desc.open { -webkit-line-clamp: unset; }
.more { border: 0; background: none; color: var(--accent); font: 500 13px var(--f-body); padding: 0; cursor: pointer; }

.tag { display: grid; gap: 6px; align-content: start; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.price { font-family: var(--f-data); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.price small { font-size: 14px; font-weight: 400; color: var(--muted); }
.mkt { font-size: 13px; color: var(--muted); }
.mkt .num { color: var(--fg); }
.disc { justify-self: start; font: 600 13px var(--f-data); color: var(--good); background: var(--good-soft); padding: 2px 8px; border-radius: 6px; }
.meter { position: relative; height: 8px; background: var(--line); border-radius: 4px; margin: 4px 0 2px; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 4px; }
.meter b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); }
.legend { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.margin { font-size: 13px; }
.margin .num { font-weight: 600; color: var(--good); }
.score { font-size: 12px; color: var(--muted); }

.actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.btn { font: 500 13.5px var(--f-body); border-radius: 8px; padding: 7px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.btn:disabled { opacity: .5; cursor: default; }
.spacer { flex: 1; }
.msg { grid-column: 1 / -1; background: var(--surface-2); border-radius: 10px; padding: 12px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 6px; color: var(--muted); font-size: 12.5px; }

.empty, .note { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; color: var(--muted); }
.note { padding: 12px 16px; text-align: left; border-style: solid; font-size: 13.5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--surface); padding: 8px 14px; border-radius: 8px; font-size: 14px; }
footer { color: var(--muted); font-size: 12.5px; }

@media (max-width: 720px) {
  .card { grid-template-columns: minmax(0, 1fr); }
  .price { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .2s; }
}
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 20px; }
.intro { min-width: 0; flex: 1 1 320px; }
.langs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-2); }
.lang { border: 0; background: transparent; color: var(--muted); font: 600 12.5px var(--f-data); letter-spacing: .04em; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.lang[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.lang:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.run .sub { font-size: 12px; color: var(--muted); }
.resale { display: grid; gap: 3px; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
.rs-k { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.rs-v { font-size: 18px; font-weight: 600; line-height: 1.2; }
.rs-v small { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.rs-q { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rs-b { font-size: 12px; color: var(--muted); }
.resale.sold .rs-b { color: var(--good); font-weight: 500; }
.margin.neg .num { color: var(--bad); }
.chip .hint { opacity: .75; font-weight: 400; }
.ph { display: block; margin: 0 0 10px; border-radius: 10px; overflow: hidden; background: var(--surface-2); aspect-ratio: 16 / 10; max-width: 100%; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.seller-says, .ai { margin-top: 10px; border-radius: 10px; padding: 8px 10px; background: var(--surface-2); display: grid; gap: 4px; font-size: 13px; }
.ss-k, .ai-k { font-size: 11.5px; letter-spacing: .03em; color: var(--muted); font-weight: 600; }
.ss-row { display: grid; gap: 1px; }
.ss-row.serious .ss-name { color: var(--warn); font-weight: 600; }
.ss-row.minor .ss-name { color: var(--muted); }
.ss-q { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.ai-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.ai-score { font: 600 12.5px var(--f-data); padding: 1px 7px; border-radius: 6px; background: var(--surface); }
.ai-score.s5, .ai-score.s4 { color: var(--good); }
.ai-score.s3 { color: var(--warn); }
.ai-score.s2, .ai-score.s1 { color: var(--bad); }
.ai-verdict { font-size: 12px; color: var(--muted); }
.ai.caution { box-shadow: inset 3px 0 0 var(--warn); }
.ai-sum { overflow-wrap: anywhere; }
.ai-issues { margin: 2px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
.ai-issues li.serious { color: var(--warn); }
.tier { display: grid; gap: 1px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.tier:last-of-type { border-bottom: 0; }
.t-h, .t-p { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.t-h { font-size: 12.5px; font-weight: 600; }
.t-days { font: 500 12px var(--f-data); color: var(--muted); }
.t-p { font-size: 13px; color: var(--muted); }
.t-p b { color: var(--fg); }
.t-net { font-weight: 600; font-size: 14px; }
.t-net.pos { color: var(--good); }
.t-net.neg { color: var(--bad); }
.liq { font-size: 12.5px; font-weight: 600; }
.liq.fast { color: var(--good); }
.liq.medium { color: var(--muted); }
.liq.slow { color: var(--warn); }
.rs-note { font-size: 11.5px; color: var(--muted); }
.tabnote { margin-bottom: 2px; }
.calc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.calc-toggle { width: 100%; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; text-align: left; background: none; border: 0; padding: 14px 16px; cursor: pointer; color: var(--fg); font: inherit; }
.calc-toggle::after { content: "▾"; margin-left: auto; color: var(--muted); }
.calc-toggle[aria-expanded="true"]::after { content: "▴"; }
.ct-t { font-weight: 600; font-size: 16px; }
.ct-h { color: var(--muted); font-size: 13px; }
.calc-body { padding: 0 16px 16px; display: grid; gap: 12px; }
.fld { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.fld input, .fld select, .fld textarea { font: 14px var(--f-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0; }
.fld textarea { resize: vertical; }
.calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.fld-chk { align-self: center; }
.calc-msg { color: var(--muted); font-size: 13.5px; }
.calc-res { display: grid; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.cr-verdict { font-weight: 700; font-size: 17px; }
.cr-verdict.great, .cr-verdict.good { color: var(--good); }
.cr-verdict.fair { color: var(--fg); }
.cr-verdict.high { color: var(--bad); }
.calc-date { font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="intro">
      <h1 data-i18n="appName">Автоохотник CZ</h1>
      <p class="lede" data-i18n="lede">Ликвидные машины на Sauto.cz и Bazoš.cz, выставленные заметно ниже рынка.</p>
      <a class="btn primary tg" id="tg" href="#" target="_blank" rel="noopener" hidden data-i18n="tg">Уведомления в Telegram</a>
    </div>
    <div class="langs" role="group" aria-label="Language / Язык">
      <button class="lang" data-lang="ru" aria-pressed="false" title="Русский">RU</button>
      <button class="lang" data-lang="en" aria-pressed="false" title="English">EN</button>
      <button class="lang" data-lang="uk" aria-pressed="false" title="Українська">UA</button>
      <button class="lang" data-lang="cs" aria-pressed="false" title="Čeština">CZ</button>
    </div>
  </header>

  <section class="run" id="run">
    <div><span class="k" data-i18n="lastRun">Последний поиск</span><span class="v" id="r-time">—</span><span class="sub" id="r-ago"></span></div>
    <div><span class="k" data-i18n="checked">Проверено объявлений</span><span class="v" id="r-checked">—</span><span class="sub" id="r-rejected"></span></div>
    <div><span class="k" data-i18n="compsCount">Для сравнения цен</span><span class="v" id="r-comps">—</span><span class="sub" id="r-sold"></span></div>
    <div><span class="k" data-i18n="liveCount">Актуальных находок</span><span class="v accent" id="r-deals">—</span></div>
  </section>

  <section class="calc" id="calc">
    <button class="calc-toggle" id="calc-toggle" aria-expanded="false" aria-controls="calc-body">
      <span class="ct-t" data-i18n="calcTitle">Проверить машину</span>
      <span class="ct-h" data-i18n="calcHint">объявление с Facebook или любого сайта</span>
    </button>
    <div class="calc-body" id="calc-body" hidden>
      <label class="fld wide" for="c-paste"><span data-i18n="calcPaste">Вставьте текст объявления — поля заполнятся сами</span>
        <textarea id="c-paste" rows="3"></textarea></label>
      <div class="calc-grid">
        <label class="fld" for="c-model"><span data-i18n="cModel">Модель</span><select id="c-model"></select></label>
        <label class="fld" for="c-year"><span data-i18n="cYear">Год</span><input id="c-year" type="number" inputmode="numeric" min="1995" max="2030"></label>
        <label class="fld" for="c-km"><span data-i18n="cKm">Пробег, км</span><input id="c-km" type="number" inputmode="numeric" min="0" step="1000"></label>
        <label class="fld" for="c-price"><span data-i18n="cPrice">Цена, Kč</span><input id="c-price" type="number" inputmode="numeric" min="0" step="1000"></label>
        <label class="fld" for="c-fuel"><span data-i18n="cFuel">Топливо</span><select id="c-fuel">
          <option value="" data-i18n="cUnknown">не знаю</option><option value="b" data-i18n="benzin">бензин</option>
          <option value="n" data-i18n="nafta">дизель</option><option value="h" data-i18n="hybrid">гибрид</option><option value="e" data-i18n="elektro">электро</option></select></label>
        <label class="fld" for="c-gear"><span data-i18n="cGear">Коробка</span><select id="c-gear">
          <option value="" data-i18n="cUnknown">не знаю</option><option value="m" data-i18n="manual">механика</option><option value="a" data-i18n="automat">автомат</option></select></label>
        <label class="fld" for="c-engine"><span data-i18n="cEngine">Объём двигателя</span><input id="c-engine" placeholder="1.6" inputmode="decimal"></label>
        <label class="chk fld-chk"><input type="checkbox" id="c-perf"> <span data-i18n="cPerf">спортивная версия (RS, GTI, ST…)</span></label>
      </div>
      <div class="calc-out" id="calc-out" aria-live="polite"></div>
    </div>
  </section>

  <div class="bar" role="toolbar" id="bar">
    <div class="tabs" id="tabs"></div>
    <select id="f-model"><option value="">—</option></select>
    <select id="f-seller">
      <option value="" data-i18n="allSellers">Все продавцы</option>
      <option value="private" data-i18n="privateOnly">Только частники</option>
      <option value="dealer" data-i18n="dealerOnly">Только дилеры</option>
    </select>
    <select id="f-sort">
      <option value="score" data-i18n="sortScore">Сначала лучшие</option>
      <option value="discount" data-i18n="sortDiscount">Самая большая скидка</option>
      <option value="margin" data-i18n="sortMargin">Самая большая прибыль</option>
      <option value="year_new" data-i18n="sortYearNew">Сначала новее</option>
      <option value="year_old" data-i18n="sortYearOld">Сначала старше</option>
      <option value="speed" data-i18n="sortSpeed">Быстрее продаются</option>
      <option value="km" data-i18n="sortKm">Меньше пробег</option>
      <option value="price" data-i18n="sortPrice">Дешевле</option>
      <option value="found" data-i18n="sortFound">Новые находки</option>
    </select>
    <label class="chk"><input type="checkbox" id="f-hot"> <span data-i18n="hotOnly">С ключевыми фразами</span></label>
  </div>

  <div id="status" class="note" hidden></div>
  <main class="list" id="list" aria-live="polite">
    <div class="empty" data-i18n="loading">Загружаю находки…</div>
  </main>

  <footer data-i18n="footer">Цены — запрашиваемые, не цены сделок.</footer>
</div>

<script>
(() => {
  const I18N = {

        <div class="mkt">${esc(t("marketLine", { m: fmt(d.market), n: d.comps, b: basisText(d.comps_basis) }))}</div>

  function render() {

    const xs = visible();

    const tabNote = state.tab === "profitable" ? `<div class="note tabnote">${esc(t("profitNote", { p: fmt(profitMin()), c: fmt(costs) }))}</div>` : "";

  document.addEventListener("click", async (e) => {

  $("f-seller").addEventListener("change", (e) => { state.seller = e.target.value; saveFilters(); render(); });
  $("f-sort").addEventListener("change", (e) => { state.sort = e.target.value; saveFilters(); render(); });
  $("f-hot").addEventListener("change", (e) => { state.hot = e.target.checked; saveFilters(); render(); });

  async function load() {
    try {
      const bust = "?t=" + Math.floor(Date.now() / 60000);
      const [dr, mr] = await Promise.all([fetch("data/deals.json" + bust, { cache: "no-store" }), fetch("data/meta.json" + bust, { cache: "no-store" })]);
      if (!dr.ok) throw new Error(dr.status);

      state.meta = mr.ok ? await mr.json() : null;

  // ---------------------------------------------------------------- calculator ("check a car")
  let market = null, marketLoad = null;
  const C = {};
  const normText = (s) => String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/ /g, " ").toLowerCase().replace(/\s+/g, " ");
  const alnum = (s) => normText(s).replace(/[^a-z0-9]/g, "");
  const quantile = (vals, q) => {
    const v = [...vals].sort((a, b) => a - b); if (!v.length) return null;
    const i = (v.length - 1) * q, lo = Math.floor(i), hi = Math.min(lo + 1, v.length - 1);
    return v[lo] + (v[hi] - v[lo]) * (i - lo);
  };
  const genOf = (y, bounds) => [bounds.filter((b) => y >= b).length, bounds.includes(y)];
  const TIERS = [
    ["двигатель", 1, (k) => Math.max(25000, 0.2 * k), 1, 1, 1], ["топливо+КПП", 1, (k) => Math.max(25000, 0.2 * k), 1, 1, 0],
    ["топливо", 1, (k) => Math.max(35000, 0.3 * k), 1, 0, 0], ["модель", 2, (k) => Math.max(50000, 0.4 * k), 1, 0, 0],
  ];
  const NEED_MARKET = { "двигатель": 6, "топливо+КПП": 8, "топливо": 10, "модель": 12 };
  const NEED5 = { "двигатель": 5, "топливо+КПП": 5, "топливо": 5, "модель": 5 };

  function selectComps(row, pool, bounds, need) {
    const y = row.year, k = row.km;
    const [gen, amb] = genOf(y, bounds);
    const years = amb ? [y - 2, y - 1] : null;
    const sameGen = (c) => { if (years) return years.includes(c.year); const [cg, ca] = genOf(c.year, bounds); return cg === gen && !ca; };
    for (const [label, dy, kmw, sf, sg, se] of TIERS) {
      if (se && !row.engine) continue;
      const dk = kmw(k);
      const comps = pool.filter((c) => sameGen(c) && (years || Math.abs(c.year - y) <= dy) && Math.abs(c.km - k) <= dk
        && (!sf || !row.fuel || c.fuel === row.fuel) && (!sg || !row.gearbox || c.gearbox === row.gearbox)
        && (!se || c.engine === row.engine) && c.perf === row.perf);
      if (comps.length >= (need[label] || 99)) {
        const yr = years ? `${years[0]}–${years[1]}` : `${y - dy}–${y + dy}`;
        return { comps, basis: `${label}, ${yr}, ±${Math.floor(dk / 1000)} тыс. км` };
      }
    }
    return null;
  }
  function withFuelFallback(row, fn) {
    if (row.fuel) return fn(row);
    const found = ["b", "n", "h"].map((f) => fn({ ...row, fuel: f })).filter(Boolean);
    if (!found.length) return null;
    const best = found.reduce((a, b) => (b.first < a.first ? b : a));
    return { ...best, basis: best.basis + ", топливо не указано" };
  }
  const decode = (r, sold) => ({ year: 2000 + r[0], km: r[1] * 1000, fuel: r[2] || null, gearbox: r[3] || null, engine: r[4] || null, perf: !!r[5],
    ...(sold ? { price: r[6] * 100, days: r[7] } : { private: !!r[6], price: r[7] * 100 }) });

  function estimate(row) {
    const m = market.models.find((x) => x.name === row.model);
    const bounds = m ? m.generations : [];
    const pool = (market.comps[row.model] || []).map((r) => decode(r, false));
    const mk = withFuelFallback(row, (r) => {
      const got = selectComps(r, pool, bounds, NEED_MARKET);
      if (!got) return null;
      const v = quantile(got.comps.map((c) => c.price), 0.5);
      return { first: v, market: v, n: got.comps.length, basis: got.basis };
    });
    if (!mk) return null;
    const cfg = market.cfg;
    const sold = (market.sold[row.model] || []).map((r) => decode(r, true)).filter((c) => c.days <= cfg.sold_max_days);
    const privatePool = pool.filter((c) => c.private);
    const tiers = (src, haggle) => (r) => {
      const got = selectComps(r, src, bounds, NEED5);
      if (!got) return null;
      const p = got.comps.map((c) => c.price);
      const asks = [quantile(p, 0.25), quantile(p, 0.5), quantile(p, 0.75)];
      return { first: asks[0], asks, haggle, n: got.comps.length, basis: got.basis };
    };
    let kind = "sold", rs = withFuelFallback(row, tiers(sold, [0.97, 0.97, 0.97]));
    if (!rs) { kind = "private"; rs = withFuelFallback(row, tiers(privatePool, [0.97, 0.95, 0.95])); }
    let asks, haggle, n = 0;
    if (rs) {
      ({ asks, haggle, n } = rs);
      asks = asks.map((a, i) => Math.min(a, mk.market * cfg.resale_caps[i]));
      if (n < 8) asks = asks.map((a) => a * 0.97);
    } else {
      kind = "estimate"; haggle = [0.95, 0.95, 0.95];
      asks = [mk.market * 0.86 / 0.95, mk.market * 0.92 / 0.95, mk.market];
    }
    asks[1] = Math.max(asks[1], asks[0]); asks[2] = Math.max(asks[2], asks[1]);
    const gets = asks.map((a, i) => a * haggle[i]);
    const r100 = (v) => Math.round(v / 100) * 100;
    const costs = cfg.resale_costs;
    const d = {
      market: Math.round(mk.market), comps: mk.n, comps_basis: mk.basis, discount: 1 - row.price / mk.market,
      resale_basis: kind, resale_n: n, resale_conf: kind === "estimate" || n < 8 ? "low" : "ok", liquidity: liquidityOf(row, bounds),
    };
    ["quick", "typical", "max"].forEach((tier, i) => {
      d["list_" + tier] = r100(asks[i]); d["resale_" + tier] = r100(gets[i]); d["profit_" + tier] = r100(gets[i] - row.price - costs);
    });
    return d;
  }
  function liquidityOf(row, bounds) {
    const L = market.liquidity, overall = market.liquidity_overall || {};
    const [g, amb] = genOf(row.year, bounds);
    const hit = (!amb && L[`${row.model}|${g}`]) || L[`${row.model}|`];
    let ratio, out;
    if (hit) { ratio = overall.sold_median ? hit.days_typical / overall.sold_median : null; out = { ...hit }; }
    else { const a = L[`${row.model}|age`]; if (!a) return { label: "unknown" }; ratio = a.ratio; out = { basis: "age", n: a.n }; }
    out.label = ratio == null ? "unknown" : ratio <= 0.8 ? "fast" : ratio >= 1.25 ? "slow" : "medium";
    return out;
  }

  function parseAd(text) {
    const t = normText(text), out = {};
    const a = t.replace(/[^a-z0-9]/g, "");
    let best = null;
    for (const m of market.models) { const tok = alnum(m.token); if (a.includes(tok) && (!best || tok.length > best.tok.length)) best = { name: m.name, tok }; }
    if (best) out.model = best.name;
    const now = new Date().getFullYear();
    let ym = /(?:r\.?\s?v\.?|rok(?: vyroby)?|vyroba|vyrobeno|registrace|1\.\s?reg\w*|uvedeni do provozu|model)\s*:?\s*(?:\d{1,2}\s*[\/.]\s*)?((?:19|20)\d{2})/.exec(t);
    if (ym && +ym[1] >= 1995 && +ym[1] <= now) out.year = +ym[1];
    else {
      const ys = [];
      for (const m of t.matchAll(/(?<![\d\/.,])((?:199\d|20[0-3]\d))(?![\d.,]*\s*(?:km|kc|,-))/g)) {
        const before = t.slice(Math.max(0, m.index - 30), m.index);
        if (+m[1] >= 1995 && +m[1] <= now && !/(dovoz\w*|dovezen\w*|v roce|stk|servis\w*|rozvod\w*|koupen\w*|vymen\w*|platn\w*|od roku|do|od)\W{0,3}(\w+\W{1,3}){0,2}$/.test(before)) ys.push(+m[1]);
      }
      if (ys.length) out.year = Math.min(...ys);
    }
    const kmVal = (s) => { const dgt = s.replace(/\D/g, ""); const n = /tkm|tis|xxx/.test(s) || dgt.length <= 3 ? +dgt * 1000 : +dgt; return n >= 1000 && n <= 600000 ? n : null; };
    const km1 = /(?:najeto|najezd|stav (?:tachometru|km)|tachometr|km)\s*:?\s*(?:pouze |jen |cca |realne )?(\d{1,3}(?:[ .]\d{3})+|\d{4,6}|\d{2,3}\s*(?:tkm|tis|xxx))/.exec(t);
    const km2 = /(\d{1,3}(?:[ .]\d{3})+|\d{4,6})\s*km\b/.exec(t) || /(\d{2,3})\s*(?:tkm|tis\.?\s*km|xxx\s*km)\b/.exec(t);
    const kmv = (km1 && kmVal(km1[1])) || (km2 && kmVal(km2[0].includes("km") && /tkm|tis|xxx/.test(km2[0]) ? km2[1] + " tkm" : km2[1]));
    if (kmv) out.km = kmv;
    const pr = /cena\s*:?\s*(\d{1,3}(?:[ .]\d{3})+|\d{4,7})/.exec(t) || /(\d{1,3}(?:[ .]\d{3})+|\d{4,7})\s*(?:kc|czk|,-)/.exec(t);
    if (pr) { const v = +pr[1].replace(/\D/g, ""); if (v >= 5000 && v <= 5000000) out.price = v; }
    if (/hybrid|plug-in|\bphev\b/.test(t)) out.fuel = "h";
    else if (/elektromobil|\belektro\b|e-golf/.test(t)) out.fuel = "e";
    else if (/nafta|diesel|(?<![a-z])(tdi|crdi|dci|hdi|tdci|d-4d|cdti|multijet)\b/.test(t)) out.fuel = "n";
    else if (/benzin|(?<![a-z])(tsi|tfsi|mpi|fsi|gdi|t-gdi|htp|vvt|vvt-i|cvvt|tce)\b|ecoboost/.test(t)) out.fuel = "b";
    if (/automat|\bdsg\b/.test(t)) out.gearbox = "a"; else if (/manual|manualni|\b[56] ?(st\.|stup|kvalt)/.test(t)) out.gearbox = "m";
    const en = /(?<![\d.,])([1-4])[.,](\d)(?![\d.,])\s*(?:l\b|tsi|tfsi|tdi|mpi|fsi|crdi|cdti|tdci|t-gdi|gdi|dci|hdi|vvt|ecoboost|d-4d|i\b|t\b|\d{2,3}\s*kw|\s|,|$)/.exec(t);
    if (en) out.engine = `${en[1]}.${en[2]}`;
    out.perf = /\b(rs|vrs|st|gti|gtd|r32|cupra)\b(?![- ]?line)|\bgolf r\b|\bi30 n\b/.test(t);
    return out;
  }

  function calcRow() {
    const num = (id) => { const v = parseFloat(String($(id).value).replace(",", ".")); return isNaN(v) ? null : v; };
    const eng = String($("c-engine").value || "").replace(",", ".").trim();
    return { model: $("c-model").value, year: num("c-year"), km: num("c-km"), price: num("c-price"),
             fuel: $("c-fuel").value || null, gearbox: $("c-gear").value || null, engine: /^\d\.\d$/.test(eng) ? eng : null, perf: $("c-perf").checked };
  }
  function renderCalc() {
    const out = $("calc-out");
    if (!market) { out.innerHTML = `<div class="calc-msg">${esc(t(marketLoad ? "cLoading" : "cNoData"))}</div>`; return; }
    const sel = $("c-model");
    if (!sel.options.length || sel.dataset.lang !== lang) {
      const cur = sel.value;
      sel.innerHTML = `<option value="">${esc(t("cChoose"))}</option>` + market.models.map((m) => `<option>${esc(m.name)}</option>`).join("");
      sel.value = cur; sel.dataset.lang = lang;
    }
    const row = calcRow();
    if (!row.model || !row.year || row.km == null || !row.price) { out.innerHTML = `<div class="calc-msg">${esc(t("cNeed"))}</div>`; return; }
    const d = estimate(row);
    if (!d) { out.innerHTML = `<div class="calc-msg">${esc(t("cNoComps"))}</div>`; return; }
    const pct = Math.round(Math.abs(d.discount) * 100);
    const [vk, cls] = d.discount >= 0.3 ? ["vGreat", "great"] : d.discount >= 0.12 ? ["vGood", "good"] : d.discount >= -0.05 ? ["vFair", "fair"] : ["vHigh", "high"];
    const signed = (d.discount >= 0 ? "−" : "+") + pct;
    const chips = [
      d.profit_quick >= profitMin() && d.resale_basis !== "estimate" ? `<span class="chip good">${esc(t("cProfitable"))}</span>` : "",
      d.discount > 0.5 ? `<span class="chip warn">⚠ ${esc(t("wCheap"))}</span>` : "",
    ].join("");
    out.innerHTML = `<div class="calc-res">
      <div class="cr-verdict ${cls}">${esc(t(vk, { p: pct, s: signed }))}</div>
      ${chips ? `<div class="chips">${chips}</div>` : ""}
      <div class="mkt">${esc(t("marketLine", { m: fmt(d.market), n: d.comps, b: basisText(d.comps_basis) }))}</div>
      ${resaleBlock(d)}
      <div class="calc-date">${esc(t("cDataDate", { d: market.generated }))}</div></div>`;
  }
  async function loadMarket() {
    if (market || marketLoad) return;
    marketLoad = fetch("data/market.json?t=" + Math.floor(Date.now() / 3600000), { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null)).catch(() => null);
    renderCalc();
    market = await marketLoad; marketLoad = null;
    renderCalc();
  }
  $("calc-toggle").addEventListener("click", () => {
    const body = $("calc-body"), open = body.hidden;
    body.hidden = !open; $("calc-toggle").setAttribute("aria-expanded", String(open));
    if (open) loadMarket();
  });
  ["c-model", "c-year", "c-km", "c-price", "c-fuel", "c-gear", "c-engine", "c-perf"].forEach((id) => {
    $(id).addEventListener("input", renderCalc); $(id).addEventListener("change", renderCalc);
  });
  $("c-paste").addEventListener("input", () => {
    if (!market) return;
    const p = parseAd($("c-paste").value);
    const set = (id, v) => { if (v != null && v !== "") $(id).value = v; };
    if (p.model) $("c-model").value = p.model;
    set("c-year", p.year); set("c-km", p.km); set("c-price", p.price); set("c-fuel", p.fuel); set("c-gear", p.gearbox); set("c-engine", p.engine);
    $("c-perf").checked = !!p.perf;
    renderCalc();
  });

  // For checking the calculator against the bot (browser console): avtookhotnik.estimate({...}).
  window.avtookhotnik = { estimate: (row) => (market ? estimate(row) : null), parseAd: (text) => (market ? parseAd(text) : null), loadMarket };

  applyStatic();
  render();
  load();
  setInterval(load, 10 * 60 * 1000);
  setInterval(renderRun, 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
})();
</script>

</body>
</html>
