<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ликвидные машины ниже рынка на Sauto.cz и Bazoš.cz">
<title>Автоохотник CZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a working feed. Run summary on top, filter bar, then one card per car,
   price set against its market median like a price tag on a lot. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #eef1f6;
  --fg: #141821;
  --muted: #5a6273;
  --line: #dde2ea;
  --accent: #2443c4;
  --accent-soft: #e5eaff;
  --good: #137a43;
  --good-soft: #def4e7;
  --warn: #9a6200;
  --warn-soft: #fbefd6;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --plate: #ffffff;
  --plate-ink: #111111;
  --plate-eu: #1d3fae;
  --shadow: 0 1px 2px rgba(20, 24, 33, .06), 0 4px 16px rgba(20, 24, 33, .05);
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --surface: #161a22; --surface-2: #1d222c; --fg: #e7eaf0; --muted: #98a1b3;
    --line: #2a303c; --accent: #8ea4ff; --accent-soft: #232c4d; --good: #5fd391; --good-soft: #17301f;
    --warn: #f2b65a; --warn-soft: #33270f; --bad: #ff8a80; --bad-soft: #3a1b19;
    --plate: #e9ebef; --plate-ink: #111111; --plate-eu: #2747b8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --surface: #161a22; --surface-2: #1d222c; --fg: #e7eaf0; --muted: #98a1b3;
  --line: #2a303c; --accent: #8ea4ff; --accent-soft: #232c4d; --good: #5fd391; --good-soft: #17301f;
  --warn: #f2b65a; --warn-soft: #33270f; --bad: #ff8a80; --bad-soft: #3a1b19;
  --plate: #e9ebef; --plate-ink: #111111; --plate-eu: #2747b8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { margin: 0; }
.tg { display: inline-flex; margin-top: 10px; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 4vw, 30px); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 4px 0 0; max-width: 68ch; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }

.run { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.run div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.run .k { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.run .v { font-family: var(--f-data); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.run .v.accent { color: var(--accent); }

.bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; }
.tab { border: 0; background: transparent; color: var(--muted); font: 500 14px var(--f-body); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.tab .c { font-family: var(--f-data); font-size: 12px; margin-left: 4px; color: var(--muted); }
select, .chk { font: 14px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.chk input { accent-color: var(--accent); margin: 0; }
button:focus-visible, select:focus-visible, a:focus-visible, .chk:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.list { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px 20px; }
.card.is-new { border-color: var(--accent); }
.head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.plate { display: inline-flex; align-items: stretch; border: 1.5px solid var(--plate-ink); border-radius: 4px; overflow: hidden; background: var(--plate); color: var(--plate-ink); font: 600 13px var(--f-data); line-height: 1; }
.plate .eu { background: var(--plate-eu); color: #fff; font-size: 9px; padding: 4px 4px 2px; display: grid; place-items: end center; }
.plate .t { padding: 4px 7px; letter-spacing: .06em; display: grid; place-items: center; }
.title { font-weight: 600; font-size: 16px; margin: 6px 0 2px; overflow-wrap: anywhere; }
.title a { color: inherit; text-decoration: none; }
.title a:hover { text-decoration: underline; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 13.5px; }
.facts b { color: var(--fg); font-weight: 600; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); max-width: 100%; overflow-wrap: anywhere; }
.chip.hot { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.src { background: transparent; border: 1px solid var(--line); }
.vin { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 10px; font-size: 13px; }
.vin-k { font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.vin code { font: 600 13px var(--f-data); letter-spacing: .04em; background: var(--surface-2); padding: 3px 7px; border-radius: 6px; overflow-wrap: anywhere; }
.vin-none { color: var(--muted); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.desc { margin-top: 8px; color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.desc.open { -webkit-line-clamp: unset; }
.more { border: 0; background: none; color: var(--accent); font: 500 13px var(--f-body); padding: 0; cursor: pointer; }

.tag { display: grid; gap: 6px; align-content: start; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.price { font-family: var(--f-data); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.price small { font-size: 14px; font-weight: 400; color: var(--muted); }
.mkt { font-size: 13px; color: var(--muted); }
.mkt .num { color: var(--fg); }
.disc { justify-self: start; font: 600 13px var(--f-data); color: var(--good); background: var(--good-soft); padding: 2px 8px; border-radius: 6px; }
.meter { position: relative; height: 8px; background: var(--line); border-radius: 4px; margin: 4px 0 2px; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 4px; }
.meter b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); }
.legend { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.margin { font-size: 13px; }
.margin .num { font-weight: 600; color: var(--good); }
.score { font-size: 12px; color: var(--muted); }

.actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.btn { font: 500 13.5px var(--f-body); border-radius: 8px; padding: 7px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.btn:disabled { opacity: .5; cursor: default; }
.spacer { flex: 1; }
.msg { grid-column: 1 / -1; background: var(--surface-2); border-radius: 10px; padding: 12px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 6px; color: var(--muted); font-size: 12.5px; }

.empty, .note { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; color: var(--muted); }
.note { padding: 12px 16px; text-align: left; border-style: solid; font-size: 13.5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--surface); padding: 8px 14px; border-radius: 8px; font-size: 14px; }
footer { color: var(--muted); font-size: 12.5px; }

@media (max-width: 720px) {
  .card { grid-template-columns: minmax(0, 1fr); }
  .price { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .2s; }
}
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 20px; }
.intro { min-width: 0; flex: 1 1 320px; }
.langs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-2); }
.lang { border: 0; background: transparent; color: var(--muted); font: 600 12.5px var(--f-data); letter-spacing: .04em; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.lang[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.lang:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.run .sub { font-size: 12px; color: var(--muted); }
.resale { display: grid; gap: 3px; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
.rs-k { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.rs-v { font-size: 18px; font-weight: 600; line-height: 1.2; }
.rs-v small { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.rs-q { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rs-b { font-size: 12px; color: var(--muted); }
.resale.sold .rs-b { color: var(--good); font-weight: 500; }
.margin.neg .num { color: var(--bad); }
.chip .hint { opacity: .75; font-weight: 400; }
.ph { display: block; margin: 0 0 10px; border-radius: 10px; overflow: hidden; background: var(--surface-2); aspect-ratio: 16 / 10; max-width: 100%; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.seller-says, .ai { margin-top: 10px; border-radius: 10px; padding: 8px 10px; background: var(--surface-2); display: grid; gap: 4px; font-size: 13px; }
.ss-k, .ai-k { font-size: 11.5px; letter-spacing: .03em; color: var(--muted); font-weight: 600; }
.ss-row { display: grid; gap: 1px; }
.ss-row.serious .ss-name { color: var(--warn); font-weight: 600; }
.ss-row.minor .ss-name { color: var(--muted); }
.ss-q { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.ai-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.ai-score { font: 600 12.5px var(--f-data); padding: 1px 7px; border-radius: 6px; background: var(--surface); }
.ai-score.s5, .ai-score.s4 { color: var(--good); }
.ai-score.s3 { color: var(--warn); }
.ai-score.s2, .ai-score.s1 { color: var(--bad); }
.ai-verdict { font-size: 12px; color: var(--muted); }
.ai.caution { box-shadow: inset 3px 0 0 var(--warn); }
.ai-sum { overflow-wrap: anywhere; }
.ai-issues { margin: 2px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
.ai-issues li.serious { color: var(--warn); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="intro">
      <h1 data-i18n="appName">Автоохотник CZ</h1>
      <p class="lede" data-i18n="lede">Ликвидные машины на Sauto.cz и Bazoš.cz, выставленные заметно ниже рынка.</p>
      <a class="btn primary tg" id="tg" href="#" target="_blank" rel="noopener" hidden data-i18n="tg">Уведомления в Telegram</a>
    </div>
    <div class="langs" role="group" aria-label="Language / Язык">
      <button class="lang" data-lang="ru" aria-pressed="false" title="Русский">RU</button>
      <button class="lang" data-lang="en" aria-pressed="false" title="English">EN</button>
      <button class="lang" data-lang="uk" aria-pressed="false" title="Українська">UA</button>
      <button class="lang" data-lang="cs" aria-pressed="false" title="Čeština">CZ</button>
    </div>
  </header>

  <section class="run" id="run">
    <div><span class="k" data-i18n="lastRun">Последний поиск</span><span class="v" id="r-time">—</span><span class="sub" id="r-ago"></span></div>
    <div><span class="k" data-i18n="checked">Проверено объявлений</span><span class="v" id="r-checked">—</span><span class="sub" id="r-rejected"></span></div>
    <div><span class="k" data-i18n="compsCount">Для сравнения цен</span><span class="v" id="r-comps">—</span><span class="sub" id="r-sold"></span></div>
    <div><span class="k" data-i18n="liveCount">Актуальных находок</span><span class="v accent" id="r-deals">—</span></div>
  </section>

  <div class="bar" role="toolbar" id="bar">
    <div class="tabs" id="tabs"></div>
    <select id="f-model"><option value="">—</option></select>
    <select id="f-seller">
      <option value="" data-i18n="allSellers">Все продавцы</option>
      <option value="private" data-i18n="privateOnly">Только частники</option>
      <option value="dealer" data-i18n="dealerOnly">Только дилеры</option>
    </select>
    <select id="f-sort">
      <option value="score" data-i18n="sortScore">Сначала лучшие</option>
      <option value="discount" data-i18n="sortDiscount">Самая большая скидка</option>
      <option value="margin" data-i18n="sortMargin">Самая большая маржа</option>
      <option value="km" data-i18n="sortKm">Меньше пробег</option>
      <option value="price" data-i18n="sortPrice">Дешевле</option>
      <option value="found" data-i18n="sortFound">Новые находки</option>
    </select>
    <label class="chk"><input type="checkbox" id="f-hot"> <span data-i18n="hotOnly">С ключевыми фразами</span></label>
  </div>

  <div id="status" class="note" hidden></div>
  <main class="list" id="list" aria-live="polite">
    <div class="empty" data-i18n="loading">Загружаю находки…</div>
  </main>

  <footer data-i18n="footer">Цены — запрашиваемые, не цены сделок.</footer>
</div>

    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  function detectLang() {
    const saved = store.get("ah-lang", null);
    if (saved && I18N[saved]) return saved;
    for (const l of navigator.languages || [navigator.language || ""]) {
      const c = String(l).slice(0, 2).toLowerCase();
      if (c === "ru" || c === "be") return "ru";
      if (c === "uk") return "uk";
      if (c === "cs" || c === "sk") return "cs";
      if (c === "en") return "en";
    }
    return "en";
  }
  let lang = detectLang();
  const t = (key, vars) => {
    let s = (I18N[lang] && I18N[lang][key]) ?? I18N.ru[key] ?? key;
    if (vars) for (const [k, v] of Object.entries(vars)) s = s.replace("{" + k + "}", v);
    return s;
  };

  let local = store.get("ah-status", {}) || {};
  Object.assign(state, store.get("ah-filters", {}) || {});
  const saveFilters = () => store.set("ah-filters", { tab: state.tab, model: state.model, seller: state.seller, sort: state.sort, hot: state.hot });
  const statusOf = (d) => local[d._id] || (d.live === false ? "archived" : "new");

  function toast(text) {
    const el = document.createElement("div"); el.className = "toast"; el.textContent = text; document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }
  let noteKey = "";
  function note(key) { noteKey = key || ""; const n = $("status"); n.hidden = !noteKey; n.textContent = noteKey ? t(noteKey) : ""; }

  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = t("appName");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll(".lang").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    $("f-model").setAttribute("aria-label", t("allModels"));
    $("f-seller").setAttribute("aria-label", t("allSellers"));
    $("f-sort").setAttribute("aria-label", t("sortScore"));
    if (noteKey) note(noteKey);
  }

  function ago(runAt) {
    const ts = Date.parse(String(runAt || "").replace(" ", "T"));
    if (!ts) return "";
    const min = Math.max(0, Math.round((Date.now() - ts) / 60000));
    if (min < 2) return t("justNow");
    if (min < 60) return t("minAgo", { n: min });
    if (min < 48 * 60) return t("hAgo", { n: Math.round(min / 60) });
    return t("dAgo", { n: Math.round(min / 1440) });
  }

  function renderRun() {
    const m = state.meta || {};
    $("r-time").textContent = m.run_at || "—";
    $("r-ago").textContent = ago(m.run_at);
    $("r-checked").textContent = fmt(m.listings_checked);
    const dropped = (m.rejected_by_description || 0) + ((m.ai && m.ai.rejected) || 0);
    $("r-rejected").textContent = dropped ? t("rejectedSub", { n: fmt(dropped) }) : "";
    $("r-comps").textContent = fmt(m.comparables);
    $("r-sold").textContent = m.sold_tracked != null ? t("soldTracked", { n: fmt(m.sold_tracked) }) : "";
    $("r-deals").textContent = fmt(state.deals.filter((d) => ["new", "interested", "contacted"].includes(statusOf(d))).length);
  }

  function renderControls() {
    const counts = {};
    for (const d of state.deals) counts[statusOf(d)] = (counts[statusOf(d)] || 0) + 1;
    $("tabs").innerHTML = STATUSES.map((s) => `<button class="tab" data-tab="${s}" aria-pressed="${state.tab === s}">${esc(t(s))}<span class="c">${s === "all" ? state.deals.length : (counts[s] || 0)}</span></button>`).join("");
    const models = [...new Set(state.deals.map((d) => d.model))].sort();
    $("f-model").innerHTML = `<option value="">${esc(t("allModels"))}</option>` + models.map((m) => `<option ${m === state.model ? "selected" : ""}>${esc(m)}</option>`).join("");
    $("f-seller").value = state.seller; $("f-sort").value = state.sort; $("f-hot").checked = state.hot;
  }

  function visible() {
    let xs = state.deals.filter((d) => state.tab === "all" || statusOf(d) === state.tab);
    if (state.model) xs = xs.filter((d) => d.model === state.model);
    if (state.seller) xs = xs.filter((d) => (state.seller === "private") === !!d.private);
    if (state.hot) xs = xs.filter((d) => (d.hot || []).length);
    const key = {
      score: (d) => -d.score, discount: (d) => -d.discount, margin: (d) => -(d.profit_typical ?? d.resale_margin),
      km: (d) => d.km, price: (d) => d.price, found: (d) => -(Date.parse((d.first_found_at || d.found_at || "").replace(" ", "T")) || 0),
    }[state.sort] || ((d) => -d.score);
    return xs.sort((a, b) => key(a) - key(b));
  }

  const cheaperBy = (d) => { const h = d.price_history || []; return h.length > 1 && h[0][1] > d.price ? h[0][1] - d.price : 0; };
  const warnText = (w) => WARN_KEYS[w] ? t(WARN_KEYS[w]) : (w.startsWith("сетевой салон") ? t("wChain") : w);
  function hotChip(h) {
    if (h === "Переезд / новое авто") return `<span class="chip hot">${esc(t("hMove"))}</span>`;
    const hint = (I18N[lang].hints || {})[h];
    return `<span class="chip hot">${esc(h)}${hint ? ` <span class="hint">· ${esc(hint)}</span>` : ""}</span>`;
  }
  function basisText(b) {
    const m = /^(двигатель|топливо\+КПП|топливо|модель), (\d{4}–\d{4}), ±(\d+) тыс\. км(, топливо не указано)?$/.exec(b || "");
    if (!m) return b || "";
    return [t(BASIS_KEYS[m[1]]), m[2], t("bKm", { k: m[3] })].concat(m[4] ? [t("bNoFuel")] : []).join(", ");
  }

  function vinRow(d) {
    if (!d.vin) return `<div class="vin"><span class="vin-k">VIN</span><span class="vin-none">${esc(t("vinNone"))}</span></div>`;
    return `<div class="vin"><span class="vin-k">VIN</span><code id="v-${esc(d._id)}">${esc(d.vin)}</code>
      <button class="btn small" data-copyvin="${esc(d._id)}">${esc(t("copyVin"))}</button>
      <a class="btn small" href="https://www.kontrolatachometru.cz/" target="_blank" rel="noopener">${esc(t("checkKm"))}</a></div>`;
  }

  function resaleBlock(d) {
    if (d.resale_typical == null) {
      return `<div class="margin">${esc(t("resale"))} <span class="num">+${fmt(d.resale_margin)} Kč</span></div>`;
    }
    const basis = d.resale_basis === "sold"
      ? t(d.resale_days != null ? "basisSold" : "basisSoldN", { n: d.resale_n, d: d.resale_days })
      : d.resale_basis === "private" ? t("basisPrivate", { n: d.resale_n }) : t("basisEstimate");
    const sign = (v) => (v >= 0 ? "+" : "−") + fmt(Math.abs(v));
    const costs = (state.meta && state.meta.resale_costs) || 6000;
    return `<div class="resale ${d.resale_basis}">
        <div class="rs-k">${esc(t("sellReal"))}</div>
        <div class="rs-v num">${fmt(d.resale_quick)} – ${fmt(d.resale_typical)} <small>Kč</small></div>
        <div class="rs-q">${esc(t("sellQuick"))} ${fmt(d.resale_quick)} · ${esc(t("sellTypical"))} ${fmt(d.resale_typical)}</div>
        <div class="rs-b">${esc(basis)}</div>
        <div class="margin ${d.profit_typical < 0 ? "neg" : ""}">${esc(t("net", { c: fmt(costs) }))} <span class="num">${sign(d.profit_quick)} … ${sign(d.profit_typical)} Kč</span></div>
      </div>`;
  }

  const defectName = (code) => ((I18N[lang].defects || {})[code.replace(/^ai:/, "")]) || I18N.ru.defects[code] || code;

  function sellerBlock(d) {
    const xs = (d.defects || []).filter((x) => x.sev !== "critical");
    if (!xs.length) return "";
    return `<div class="seller-says"><div class="ss-k">${esc(t("sellerSays"))}</div>${xs.map((x) =>
      `<div class="ss-row ${x.sev}"><span class="ss-name">${x.sev === "serious" ? "⚠ " : ""}${esc(defectName(x.code))}</span>
       <span class="ss-q" lang="cs">«${esc(x.quote)}»</span></div>`).join("")}</div>`;
  }

  function aiBlock(d) {
    const a = d.ai_check;
    if (!a) return "";
    const issues = (a.issues || []).filter((i) => i.severity !== "critical");
    const verdict = a.verdict === "ok" ? t("aiOk") : t("aiCaution");
    return `<div class="ai ${a.verdict}"><div class="ai-head"><span class="ai-k">${esc(t("aiTitle"))}</span>
        <span class="ai-score s${a.condition_score}">${esc(t("aiScore", { s: a.condition_score }))}</span>
        <span class="ai-verdict">${esc(verdict)}</span></div>
      <div class="ai-sum">${esc((a.summary || {})[lang] || (a.summary || {}).ru || "")}${a.photos_usable === false ? " · " + esc(t("aiNoPhotos")) : ""}</div>
      ${issues.length ? `<ul class="ai-issues">${issues.map((i) => `<li class="${i.severity}">${esc(defectName(i.code))}${i.source === "photo" ? ` (${esc(t("aiPhoto"))})` : ""}: <span ${i.source === "description" ? 'lang="cs"' : ""}>${esc(i.evidence)}</span></li>`).join("")}</ul>` : ""}
    </div>`;
  }

  function photo(d) {
    const src = (d.photos && d.photos[0]) || d.image;
    if (!src) return "";
    return `<a class="ph" href="${esc(d.url)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></a>`;
  }

  function card(d) {
    const st = statusOf(d);
    const id = esc(d._id);
    const pct = Math.max(0, Math.min(100, (d.price / (d.market * 1.15)) * 100));
    const mk = (1 / 1.15) * 100;
    const sellerName = d.seller && d.seller !== "частник" ? ": " + esc(d.seller) : "";
    const chips = [
      `<span class="chip src">${d.source === "sauto" ? "Sauto.cz" : "Bazoš.cz"}</span>`,
      `<span class="chip ${d.private ? "good" : ""}">${d.private ? esc(t("private")) : esc(t("dealer")) + sellerName}</span>`,
      ...(d.hot || []).map(hotChip),
      ...(d.warnings || []).map((w) => `<span class="chip warn">⚠ ${esc(warnText(w))}</span>`),
      d.crashed_in_past ? `<span class="chip bad">${esc(t("crashed"))}</span>` : "",
      (d.comps < 10 || /^модель|топливо не указано/.test(d.comps_basis || "")) ? `<span class="chip">${esc(t("approx"))}</span>` : "",
      st === "archived" ? `<span class="chip bad">${esc(t("gone"))}</span>` : "",
      cheaperBy(d) ? `<span class="chip good">${esc(t("cheaper", { p: fmt(d.price_history[0][1]) }))}</span>` : "",
      d.service_book ? `<span class="chip">${esc(t("serviceBook"))}</span>` : "",
      d.cebia_report ? `<span class="chip good">${esc(t("cebia"))}</span>` : "",
      d.km_per_year < 12000 ? `<span class="chip good">${esc(t("lowKm"))}</span>` : "",
    ].join("");
    const facts = [
      `<span><b>${fmt(d.km)}</b> ${esc(t("km"))}</span>`,
      `<span><b>${fmt(d.km_per_year)}</b> ${esc(t("kmYear"))}</span>`,
      d.engine ? `<span>${esc(t("engine"))} <b>${esc(d.engine)}</b></span>` : "",
      d.power_kw ? `<span><b>${esc(d.power_kw)}</b> kW</span>` : "",
      d.fuel ? `<span>${esc(I18N[lang][d.fuel] || d.fuel)}</span>` : "",
      d.gearbox ? `<span>${esc(t(d.gearbox === "automat" ? "automat" : "manual"))}</span>` : "",
      d.location ? `<span>📍 ${esc(d.location)}</span>` : "",
      d.created ? `<span>${esc(t("listed"))} <b>${esc(d.created.slice(0, 10))}</b></span>` : "",
      d.first_found_at ? `<span>${esc(t("foundAt"))} <b>${esc(d.first_found_at)}</b></span>` : "",
    ].join("");
    const open = state.openDesc.has(d._id);
    const desc = d.description ? `<div class="desc ${open ? "open" : ""}" lang="cs">${esc(d.description)}</div><button class="more" data-desc="${id}">${esc(t(open ? "descLess" : "descMore"))}</button>` : "";
    const msg = state.openMsg.has(d._id) ? `<div class="msg"><div class="msg-head"><span>${esc(t("msgHead"))} <b class="num">${fmt(d.offer)} Kč</b></span><button class="btn" data-copy="${id}">${esc(t("copy"))}</button></div><span id="m-${id}" lang="cs">${esc(d.message_cz)}</span></div>` : "";
    const found = Date.parse((d.first_found_at || "").replace(" ", "T"));
    const fresh = st === "new" && found && Date.now() - found < 24 * 3600 * 1000;
    return `<article class="card ${fresh ? "is-new" : ""}">
      <div>
        ${photo(d)}
        <div class="head"><span class="plate"><span class="eu">CZ</span><span class="t">${esc(d.year)}</span></span><span class="chip">${esc(d.model)}</span></div>
        <div class="title"><a href="${esc(d.url)}" target="_blank" rel="noopener" lang="cs">${esc(d.title)}</a></div>
        <div class="facts">${facts}</div>
        <div class="chips">${chips}</div>
        ${sellerBlock(d)}
        ${aiBlock(d)}
        ${vinRow(d)}
        ${desc}
      </div>
      <div class="tag">
        <div class="price">${fmt(d.price)} <small>Kč</small></div>
        <span class="disc">${esc(t("offMarket", { p: Math.round(d.discount * 100) }))}</span>
        <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i><b style="left:${mk}%"></b></div>
        <div class="legend"><span>${esc(t("legendPrice"))}</span><span>${esc(t("legendMarket"))}</span></div>
        <div class="mkt">${esc(t("marketLine", { m: fmt(d.market), n: d.comps, b: basisText(d.comps_basis) }))}</div>
        ${resaleBlock(d)}
        <div class="score">${esc(t("score"))} <span class="num">${esc(d.score)}</span></div>
      </div>
      <div class="actions">
        <a class="btn primary" href="${esc(d.url)}" target="_blank" rel="noopener">${esc(t("open"))}</a>
        <button class="btn" data-msg="${id}" aria-expanded="${state.openMsg.has(d._id)}">${esc(t("msgBtn"))}</button>
        <span class="spacer"></span>
        ${["interested", "contacted", "rejected"].map((s) => `<button class="btn" data-set="${s}" data-id="${id}" aria-pressed="${st === s}">${esc(t(s))}</button>`).join("")}
      </div>
      ${msg}
    </article>`;
  }

  function render() {
    renderRun(); renderControls();
    const xs = visible();
    $("list").innerHTML = xs.length ? xs.map(card).join("") : `<div class="empty">${esc(t(state.deals.length ? "emptyTab" : "emptyAll"))}</div>`;
  }

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.lang) { lang = b.dataset.lang; store.set("ah-lang", lang); applyStatic(); render(); }
    else if (b.dataset.tab) { state.tab = b.dataset.tab; saveFilters(); render(); }
    else if (b.dataset.msg) { const id = b.dataset.msg; state.openMsg.has(id) ? state.openMsg.delete(id) : state.openMsg.add(id); render(); }
    else if (b.dataset.desc) { const id = b.dataset.desc; state.openDesc.has(id) ? state.openDesc.delete(id) : state.openDesc.add(id); render(); }
    else if (b.dataset.copy || b.dataset.copyvin) {
      const el = b.dataset.copy ? $("m-" + b.dataset.copy) : $("v-" + b.dataset.copyvin);
      try { await navigator.clipboard.writeText(el.textContent); toast(t("copied")); }
      catch (err) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t("selectManual")); }
    } else if (b.dataset.set) {
      const id = b.dataset.id;
      if (local[id] === b.dataset.set) delete local[id]; else local[id] = b.dataset.set;
      store.set("ah-status", local); render();
    }
  });
  $("f-model").addEventListener("change", (e) => { state.model = e.target.value; saveFilters(); render(); });
  $("f-seller").addEventListener("change", (e) => { state.seller = e.target.value; saveFilters(); render(); });
  $("f-sort").addEventListener("change", (e) => { state.sort = e.target.value; saveFilters(); render(); });
  $("f-hot").addEventListener("change", (e) => { state.hot = e.target.checked; saveFilters(); render(); });

  async function load() {
    try {
      const bust = "?t=" + Math.floor(Date.now() / 60000);
      const [dr, mr] = await Promise.all([fetch("data/deals.json" + bust, { cache: "no-store" }), fetch("data/meta.json" + bust, { cache: "no-store" })]);
      if (!dr.ok) throw new Error(dr.status);
      const data = await dr.json();
      state.meta = mr.ok ? await mr.json() : null;
      state.deals = (data.deals || []).map((d) => ({ ...d, _id: d.id }));
      if (state.meta && state.meta.telegram_url) { const a = $("tg"); a.href = state.meta.telegram_url; a.hidden = false; }
      note("");
      render();
    } catch (err) {
      if (!state.deals.length) { note("loadError"); $("list").innerHTML = `<div class="empty">${esc(t("noData"))}</div>`; }
    }
  }

  applyStatic();
  render();
  load();
  setInterval(load, 10 * 60 * 1000);
  setInterval(renderRun, 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
})();
</script>

</body>
</html>
